# nnInteractive on several GPUs: one server container per GPU, one nginx proxy in front.
# Users connect only to the proxy, http://<this-host>:1527 (PUBLIC_PORT in .env), each
# with their own API key. .env lists the keys per GPU; a user's key decides their GPU.
# Start with: docker compose up -d
#
# Preconfigured for GPUs 0 and 1 (the numbers shown by `nvidia-smi -L`).
# To add a GPU, e.g. GPU 2:
#   1. Copy the nn1 block below, rename it to nn2 and change its other two 1s to 2:
#      GPU2_USER_KEYS and device_ids: ["2"].
#   2. Add a line GPU2_USER_KEYS=<keys of its users> to .env.
#   3. Apply the change:  docker compose up -d
# To remove a GPU, delete its block here and its line in .env (move its users' keys
# to another GPU's line), then run:  docker compose up -d --remove-orphans
#
# Windows (Docker Desktop): read "Windows notes" in README.md first.

# Settings shared by all GPU services (merged into each one by "<<: *nninteractive").
x-nninteractive: &nninteractive
  image: ${NN_IMAGE:-ghcr.io/mic-dkfz/nninteractive-server:latest}
  restart: unless-stopped
  # Starts the server with --max-sessions set to the number of the GPU's user keys
  # (USER_KEYS below): one session per user.
  entrypoint: ["sh", "/gpu-start.sh"]
  volumes:
    - ./gpu-start.sh:/gpu-start.sh:ro
  environment: &nninteractive-env
    # The only key the GPU containers accept. The proxy sends it in place of the
    # user's key; users never see it.
    NN_INTERACTIVE_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
    # Number GPUs the way nvidia-smi does. No effect on Linux; see "Windows notes" in README.md.
    CUDA_DEVICE_ORDER: PCI_BUS_ID
  # Extra nninteractive-server options for every GPU container, for example a
  # longer idle timeout (see README.md):
  # command: ["--idle-timeout-seconds", "1800"]
  #
  # No "ports:" on purpose: GPU containers are reachable only through the proxy.

services:
  # One service per GPU: name it nn<GPU number> and use the same number in
  # GPU<number>_USER_KEYS and device_ids.
  nn0:
    <<: *nninteractive
    environment:
      <<: *nninteractive-env
      USER_KEYS: ${GPU0_USER_KEYS:?Set GPU0_USER_KEYS in .env}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  nn1:
    <<: *nninteractive
    environment:
      <<: *nninteractive-env
      USER_KEYS: ${GPU1_USER_KEYS:?Set GPU1_USER_KEYS in .env}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

  # The only published port. Checks the key of every request and passes the request
  # to that user's GPU service, see nginx.conf.
  proxy:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-1527}:1527"
    # proxy-start.sh turns the keys from .env into nginx settings, then starts nginx.
    entrypoint: ["sh", "/proxy-start.sh"]
    env_file: .env
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy-start.sh:/proxy-start.sh:ro
