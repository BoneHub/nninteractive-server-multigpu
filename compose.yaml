# nnInteractive for several users on several GPUs: one server container per user, one
# nginx proxy in front. Users connect only to the proxy, http://<this-host>:1527
# (PUBLIC_PORT in .env), each with their own API key. .env lists the keys per GPU; a
# user's key decides their container, and so their GPU.
#
# First start, and after adding or removing a user or a GPU in .env:
#   docker compose run --rm configure
#   docker compose up -d --remove-orphans
# The first command writes compose.override.yaml with one service per user key
# (gpu0-user1, gpu0-user2, ..., gpu1-user1, ...), each a copy of the "nninteractive"
# service below. Other changes to .env need only the second command.
#
# Windows (Docker Desktop): read "Windows notes" in README.md.

services:
  # Template of the users' server containers. Its settings apply to every user's
  # container; the template itself runs no container (scale: 0).
  nninteractive:
    image: ${NN_IMAGE:-ghcr.io/mic-dkfz/nninteractive-server:latest}
    scale: 0
    restart: unless-stopped
    # Starts the server on the user's GPU (--device cuda:<number>) with
    # --max-sessions MAX_SESSIONS_PER_USER.
    entrypoint: ["sh", "/server-start.sh"]
    volumes:
      - ./server-start.sh:/server-start.sh:ro
    environment:
      # The only key the server containers accept. The proxy sends it in place of the
      # user's key; users never see it.
      NN_INTERACTIVE_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-1}
      # Number the GPUs the way nvidia-smi does, so that GPU<number>_USER_KEYS in .env
      # and --device cuda:<number> mean the same GPU.
      CUDA_DEVICE_ORDER: PCI_BUS_ID
    # Every container sees all GPUs and computes on its user's GPU only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Extra nninteractive-server options for every user's container, for example a
    # longer idle timeout (see README.md):
    # command: ["--idle-timeout-seconds", "1800"]
    #
    # No "ports:" on purpose: server containers are reachable only through the proxy.

  # The only published port. Checks the key of every request and passes the request
  # to that user's server container, see nginx.conf.
  proxy:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-1527}:1527"
    # proxy-start.sh turns the keys from .env into nginx settings, then starts nginx.
    entrypoint: ["sh", "/proxy-start.sh"]
    env_file: .env
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy-start.sh:/proxy-start.sh:ro

  # Writes compose.override.yaml from .env: docker compose run --rm configure
  # Never started by "docker compose up" (profile).
  configure:
    image: nginx:stable
    profiles: [configure]
    entrypoint: ["sh", "/project/configure.sh"]
    env_file: .env
    network_mode: none
    volumes:
      - .:/project
