# nnInteractive on several GPUs: one server container per GPU, one nginx proxy in front.
# Users connect only to the proxy, http://<this-host>:1527 (PUBLIC_PORT in .env),
# with the API key from .env. Start with: docker compose up -d
#
# Preconfigured for GPUs 0 and 1 (the numbers shown by `nvidia-smi -L`).
# To add a GPU, e.g. GPU 2:
#   1. Copy the nn1 block below, rename it to nn2 and set device_ids: ["2"].
#   2. Add an nn2 line to depends_on of the proxy service at the bottom of this file.
#   3. Add "server nn2:1527;" to the upstream block in nginx.conf (names must match).
#   4. Apply the change:  docker compose up -d
#                         docker compose restart proxy
# To remove a GPU, delete it in the same three places, then run
#   docker compose up -d --remove-orphans
#   docker compose restart proxy
#
# Windows (Docker Desktop): read "Windows notes" in README.md first.

# Settings shared by all GPU services (merged into each one by "<<: *nninteractive").
x-nninteractive: &nninteractive
  image: ${NN_IMAGE:-ghcr.io/mic-dkfz/nninteractive-server:latest}
  restart: unless-stopped
  environment: &nninteractive-env
    NN_INTERACTIVE_API_KEY: ${NN_INTERACTIVE_API_KEY:?Set NN_INTERACTIVE_API_KEY in .env}
    # Number GPUs the way nvidia-smi does. No effect on Linux; see "Windows notes" in README.md.
    CUDA_DEVICE_ORDER: PCI_BUS_ID
  # Extra nninteractive-server options for every GPU container, for example more
  # concurrent users per GPU (see README.md):
  # command: ["--max-sessions", "4"]
  #
  # No "ports:" on purpose: GPU containers are reachable only through the proxy.

services:
  # One service per GPU: name it nn<GPU number> and put the same number in device_ids.
  nn0:
    <<: *nninteractive
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  nn1:
    <<: *nninteractive
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

  # The only published port. Sends each user to one GPU service, see nginx.conf.
  proxy:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-1527}:1527"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # One line per GPU service. "restart: true" restarts the proxy whenever Compose
    # recreates a GPU container (e.g. after an image update), so nginx looks up the
    # container's address again (it can change).
    depends_on:
      nn0: { condition: service_started, restart: true }
      nn1: { condition: service_started, restart: true }
