# nginx reverse proxy in front of the users' nnInteractive server containers (see
# compose.yaml). All users connect here, each with their own API key. The key decides
# the container (gpu0-user2 for the 2nd key in GPU0_USER_KEYS in .env), so a user
# always reaches their own container on their GPU, whatever IP address they connect
# from.
#
# After changing this file, apply it with:  docker compose restart proxy

worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Room in the key lookup tables for keys of up to 128 characters (the limit
    # proxy-start.sh enforces). Must come before the first map.
    map_hash_bucket_size 256;

    # Written from .env by proxy-start.sh when the proxy starts. Defines:
    #   $nn_user           server container (compose service) of the key in the
    #                      request: gpu0-user2 for the 2nd key in GPU0_USER_KEYS,
    #                      and so on; "" for an unknown key
    #   $nn_internal_auth  "Bearer <INTERNAL_API_KEY>", the only key the server
    #                      containers accept
    include /etc/nginx/users.conf;

    # The user for the log; "-" for an unknown key.
    map $nn_user $nn_log_user {
        ""      "-";
        default $nn_user;
    }

    # Access log: client address and user, then the server container (IP:port) that
    # served the request.
    log_format nninteractive '$remote_addr $nn_log_user -> $upstream_addr [$time_local] "$request" '
                             '$status $body_bytes_sent ${request_time}s';
    access_log /dev/stdout nninteractive;

    # Answer to a request without a valid key, worded like the nnInteractive server's.
    map $http_authorization $nn_auth_error {
        ""      '{"detail":"Missing bearer token"}';
        default '{"detail":"Invalid bearer token"}';
    }

    # WebSocket-safe proxying: send "Connection: upgrade" only when the client asks
    # for a protocol upgrade, "close" otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Look up the server containers in Docker's DNS when requests arrive (again at most
    # every 10s), not once at startup: a restarted or recreated container is found
    # without restarting the proxy, and one that is down affects only its user.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 1527;

        # Content type of the answers nginx gives itself (401, /healthz without a key).
        default_type application/json;

        # Whole 3D images are uploaded: no size limit, and stream uploads and
        # responses straight through instead of buffering them in nginx.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;

        # Allow slow requests (large uploads, preprocessing, a busy GPU).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Server containers are on the local Docker network and accept connections at
        # once. If one does not within 5s it is down: answer 502 without waiting longer.
        proxy_connect_timeout 5s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The server containers never see the user's key, only the internal one.
        proxy_set_header Authorization $nn_internal_auth;

        location / {
            if ($nn_user = "") {
                return 401 $nn_auth_error;
            }
            proxy_pass http://$nn_user:1527;
        }

        # Like the nnInteractive server, /healthz needs no key. With a user's key it
        # asks that user's server container; without a valid key only the proxy answers.
        location = /healthz {
            if ($nn_user = "") {
                return 200 '{"ok":true}';
            }
            proxy_pass http://$nn_user:1527;
        }
    }
}
