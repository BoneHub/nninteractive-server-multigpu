# nginx reverse proxy in front of the nnInteractive GPU containers (see compose.yaml).
# All users connect here; each user is sent to one GPU container and stays there.
#
# After changing this file, apply it with:  docker compose restart proxy

worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Access log: client address, then the GPU container (IP:port) that served the request.
    log_format nninteractive '$remote_addr -> $upstream_addr [$time_local] "$request" '
                             '$status $body_bytes_sent ${request_time}s';
    access_log /dev/stdout nninteractive;

    # WebSocket-safe proxying: send "Connection: upgrade" only when the client asks
    # for a protocol upgrade, "close" otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream nninteractive {
        # A user's session (image, prompts, segmentation) lives in the memory of the
        # GPU container that created it, so every request from that user must reach
        # the same container. Pick the container by hashing the client IP address;
        # "consistent" keeps most users on their GPU when GPUs are added or removed.
        hash $remote_addr consistent;

        # Share between all nginx workers which GPU containers are down, so their
        # users are moved to another container right away (see proxy_connect_timeout).
        zone nninteractive 64k;

        # One line per GPU service in compose.yaml; the names must match.
        server nn0:1527;
        server nn1:1527;
    }

    server {
        listen 1527;

        # Whole 3D images are uploaded: no size limit, and stream uploads and
        # responses straight through instead of buffering them in nginx.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;

        # Allow slow requests (large uploads, preprocessing, a busy GPU).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # GPU containers are on the local Docker network and accept connections at
        # once. If one does not within 5s it is down: use another one.
        proxy_connect_timeout 5s;

        location / {
            proxy_pass http://nninteractive;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
